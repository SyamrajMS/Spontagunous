{{ define "main" }}

{{ "<!--contactHeader.html-->" | safeHTML }}
  <section class="page-header">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <h2>{{ .Title }}</h2>
          <p>
            Prefer direct email? Reach out anytime at
            <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
          </p>
        </div>
      </div>
    </div>
  </section>

{{ "<!--contactForm.html-->" | safeHTML }}
  <section class="contact">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          {{ $formAction := .Site.Params.contactFormAction | default (printf "https://formsubmit.co/%s" .Site.Params.email) }}
          <form id="contact-form" action="{{ $formAction }}" method="POST" class="contact-form row">
            <!-- FormSubmit helpers -->
            <input type="hidden" name="_subject" value="New Inquiry from Spontagunous Website" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <!-- Honeypot spam filter -->
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

            <div class="col-lg-6">
              <input
                type="text"
                class="form-control"
                placeholder="Full Name"
                name="name"
                required
              />
            </div>
            <div class="col-lg-6">
              <input
                type="email"
                class="form-control"
                placeholder="Work Email"
                name="email"
                required
              />
            </div>
            <div class="col-lg-6">
              <input type="text" class="form-control" placeholder="Clinic / Practice Name" name="clinic" />
            </div>
            <div class="col-lg-6">
              <input type="text" class="form-control" placeholder="Phone Number (Optional)" name="phone" />
            </div>
            <div class="col-12">
              <input type="text" class="form-control" placeholder="Subject" name="subject" />
            </div>
            <div class="col-12">
              <textarea
                class="form-control"
                placeholder="Tell us about your dental practice and patient call volume..."
                required
                cols="30"
                rows="6"
                name="message"
              ></textarea>
            </div>
            <div class="col-12 text-right mt-3">
              <button id="contact-form-button" class="btn btn-primary-filled" type="submit">
                Send Message
              </button>
            </div>
            <div class="col-12">
              <div id="contact-form-status" class="mt-3"></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
{{ end }}
