title: Frequently asked questions
description: Everything you need to know about integrating Spontagunous into your dental practice.
faqItem:
  - question: How quickly can Spontagunous go live at my practice?
    answer: Typically 6–7 days total. Days 1–2 is practice discovery and triage rule setup. Days 3–5 is voice pipeline configuration and custom admin portal build. Days 6–7 is go-live and overflow guard routing.
    dataTarget: One
    show: show

  - question: Will this replace my front-desk staff?
    answer: No. Spontagunous is designed to shield your staff from continuous phone interruptions so they can focus on in-office patients. When a caller requests to speak to a human, a smooth warm transfer is initiated instantly.
    dataTarget: Two
    show:

  - question: What practice management systems do you integrate with?
    answer: We integrate with Open Dental, Dentrix, Eaglesoft, and Google Calendar out of the box. Custom integrations are available for other PMS platforms — contact Syamraj directly to discuss your setup.
    dataTarget: Three
    show:

  - question: Is patient data HIPAA compliant?
    answer: Yes. All call recordings use encrypted audio, secure transit protocols, and compliant data isolation tailored for clinical entities. Data is never shared with third parties.
    dataTarget: Four
    show:

  - question: What does "bespoke" actually mean for my clinic?
    answer: Every Spontagunous deployment is custom-engineered — your triage scripts, escalation rules, PMS mappings, and admin portal are built specifically for your practice's workflows. There is no generic SaaS platform you are forced into.
    dataTarget: Five
